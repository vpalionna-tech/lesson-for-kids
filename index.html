<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5EDFF; --surface:#FFFFFF; --ink:#3A1F5E; --line:#3A1F5E; --muted:#6B5590; --pink:#D9307F; --mint:#1FA886; --sun:#FFD23F; --good:#C9F0D6; --bad:#FFD9E6; --focus:#0A5CFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1B1033; --surface:#2A1A4D; --ink:#FFF4FB; --line:#C9A8FF; --muted:#D9C8F5; --pink:#FF7DB8; --mint:#4DDDB5; --good:#1E5A44; --bad:#6B2A4A; --focus:#9CC1FF; }
}
:root[data-theme="dark"]{ --bg:#1B1033; --surface:#2A1A4D; --ink:#FFF4FB; --line:#C9A8FF; --muted:#D9C8F5; --pink:#FF7DB8; --mint:#4DDDB5; --good:#1E5A44; --bad:#6B2A4A; --focus:#9CC1FF; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;font-size:20px;line-height:1.35}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.ipa{font-family:'Noto Sans','Segoe UI','DejaVu Sans',system-ui,sans-serif}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 4px;max-width:860px;margin:0 auto;flex-wrap:wrap}
.top h1{font-size:clamp(24px,5vw,34px);margin:0;font-weight:700}
.stars{background:var(--sun);color:#3A1F5E;border:4px solid var(--line);border-radius:999px;padding:0 16px;font-weight:700;font-size:26px;white-space:nowrap}
.stick{width:100%;min-height:38px;font-size:30px;letter-spacing:4px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 36px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 14px}
.tab{cursor:pointer;background:var(--surface);border:4px solid var(--line);border-radius:18px;padding:6px 2px 4px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.tab .ic{font-size:28px}
.tab[aria-selected="true"]{background:var(--sun);color:#3A1F5E;transform:translateY(3px)}

.card{background:var(--surface);border:4px solid var(--line);border-radius:26px;padding:16px 12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px}
.chip{cursor:pointer;font-weight:600;font-size:17px;border:3px solid var(--line);border-radius:999px;padding:3px 16px;background:var(--surface);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn{cursor:pointer;border:4px solid var(--line);border-radius:999px;background:var(--sun);color:#3A1F5E;font-weight:700;font-size:24px;padding:6px 24px;min-height:56px}
.btn.alt{background:var(--surface);color:var(--ink)}
.btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn.round{width:64px;height:64px;padding:0;font-size:30px}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:12px}
.q{font-size:clamp(24px,5.5vw,34px);font-weight:700;margin:6px 0}
.sub{color:var(--muted);font-size:18px;margin:2px 0 10px}
.pop{font-size:clamp(26px,6vw,38px);font-weight:700;min-height:1.4em;margin-top:8px}
.party{font-size:56px;margin:6px 0}
.big{font-size:clamp(70px,20vw,120px);line-height:1.1}
.word{font-size:clamp(32px,8vw,48px);font-weight:700;margin:4px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.grid.big3{grid-template-columns:repeat(3,1fr)}
.tile{cursor:pointer;background:var(--surface);border:4px solid var(--line);border-radius:22px;min-height:96px;padding:4px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:18px}
.tile .em{font-size:48px;line-height:1.05}
.grid.big3 .tile{min-height:130px}
.grid.big3 .tile .em{font-size:64px}
.tile.ok{outline:6px solid #1F8A4C;outline-offset:2px;background:var(--good)}
.tile.no{opacity:.35}
.ic-svg{width:1.1em;height:1.1em;vertical-align:-.15em;color:var(--ink)}
.det{border:4px dashed var(--line);border-radius:22px;padding:8px;margin:0 0 12px;min-height:150px}

.items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:clamp(44px,12vw,72px);margin:8px 0}
.opts{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.opt{cursor:pointer;border:4px solid var(--line);border-radius:20px;background:var(--surface);padding:12px 4px;font-weight:700;font-size:clamp(20px,5vw,28px);min-height:76px;color:var(--ink)}
.opt.ok{background:var(--good);outline:5px solid #1F8A4C}
.opt.no{opacity:.35}
.opts.two{grid-template-columns:repeat(2,1fr)}
.sent{font-size:clamp(24px,5.5vw,34px);font-weight:600;margin:10px 0}
mark{background:var(--sun);color:#3A1F5E;border-radius:6px;padding:0 6px;font-weight:700}
.rulebox{text-align:left;border:4px solid var(--line);border-radius:20px;padding:6px 12px;margin:8px 0}
.rr{display:flex;align-items:center;gap:10px;border-bottom:3px dotted var(--line);padding:8px 0;cursor:pointer;background:none;width:100%;border-top:0;border-left:0;border-right:0;text-align:left;font-size:22px}
.rr:last-child{border-bottom:0}
.rr .who{min-width:84px;font-weight:700}
.rr .hv{font-weight:700;color:var(--pink)}
.text{text-align:left}
.ts{border:3px solid var(--line);border-radius:16px;padding:8px 12px;margin:8px 0;background:var(--surface)}
.ts .en{font-size:clamp(22px,5vw,30px);font-weight:600}
.ts .uk{font-size:20px;color:var(--muted);margin-top:4px}
.tray{min-height:68px;border:4px dashed var(--line);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:10px}
.tray.ok{border-style:solid;background:var(--good)}
.tray.no{border-style:solid;background:var(--bad)}
.tok{cursor:pointer;font-weight:700;font-size:26px;border:4px solid var(--line);border-radius:14px;padding:4px 14px;background:var(--sun);color:#3A1F5E}
.tray .tok{background:var(--surface);color:var(--ink)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;margin-bottom:12px}
.pets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.dot{width:54px;height:54px;border-radius:50%;border:4px solid var(--line);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{outline:6px solid var(--pink);outline-offset:2px}
.inp{font-size:24px;font-weight:600;border:4px solid var(--line);border-radius:16px;padding:6px 14px;background:var(--surface);color:var(--ink);text-align:center;width:90%;max-width:320px}
.story{text-align:left;font-size:clamp(22px,5vw,30px);font-weight:600;border:4px solid var(--line);border-radius:22px;padding:12px 16px;background:var(--surface);margin:10px 0}

@media (max-width:560px){
  body{font-size:18px}
  .tab{font-size:11px} .tab .ic{font-size:24px}
  .pets{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion: reduce){ .btn:active,.tab[aria-selected="true"]{transform:none} }
</style>
</head>
<body>
<div class="top"><h1>🦄 Magic Pets</h1><div class="stars" id="stars" aria-label="Stars">⭐ 0</div><div class="stick" id="stick" aria-label="Stickers"></div></div>
<div class="wrap">
  <div class="tabs" role="tablist" id="tabs" aria-label="Games"></div>
  <main id="view" aria-live="polite"></main>
</div>

<script>
var $=function(s){ return document.querySelector(s); };
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function pick(a){ return a[rnd(0,a.length-1)]; }
var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function say(t,rate){ try{ if(!canSpeak) return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=rate||0.8; u.pitch=1.15; window.speechSynthesis.speak(u);}catch(e){} }
var PRAISE=['Great job!','Super!','Wow!','Yes!','Awesome!','Well done!'];
var STICK=['🦄','🐶','🐰','🌈','🐱','🎈','🦋','🍭','🐼','👑'];
var stars=0, stickers=[];
function addStar(){ stars++; $('#stars').textContent='⭐ '+stars; if(stars%5===0){ stickers.push(STICK[(stars/5-1)%STICK.length]); $('#stick').textContent=stickers.join(' '); } }
var timers=[]; function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function chips(modes,cur,attr){ return '<div class="chips" role="group" aria-label="Choose">'+modes.map(function(m){ return '<button class="chip" '+attr+'="'+m[0]+'" aria-pressed="'+(String(cur)===String(m[0]))+'">'+m[1]+'</button>'; }).join('')+'</div>'; }
function bindAttr(attr,fn){ var cs=document.querySelectorAll('['+attr+']'); for(var i=0;i<cs.length;i++) cs[i].onclick=function(){ fn(this.getAttribute(attr)); }; }

/* ---------- data ---------- */
var TAIL='<svg class="ic-svg" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 40 C 8 18, 32 32, 40 8" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg>';
var HORN='<svg class="ic-svg" viewBox="0 0 48 48" aria-hidden="true"><polygon points="24,3 34,42 14,42" fill="#FFD23F" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>';
var ANIM=[
 {k:'cat',e:'🐱',ipa:'/kæt/',uk:'кіт',f:['two small ears','a long tail','four legs','a small nose']},
 {k:'dog',e:'🐶',ipa:'/dɒɡ/',uk:'собака',f:['two big ears','a short tail','four legs','a big nose']},
 {k:'rabbit',e:'🐰',ipa:'/ˈræbɪt/',uk:'кролик',f:['two long ears','a small tail','four legs','a pink nose']},
 {k:'bird',e:'🐦',ipa:'/bɜːd/',uk:'птах',f:['two wings','two legs','a small tail','two small eyes']},
 {k:'fish',e:'🐟',ipa:'/fɪʃ/',uk:'рибка',f:['a tail','two big eyes','a small mouth']},
 {k:'frog',e:'🐸',ipa:'/frɒɡ/',uk:'жаба',f:['four legs','two big eyes','a big mouth']},
 {k:'unicorn',e:'🦄',ipa:'/ˈjuːnɪkɔːn/',uk:'єдиноріг',f:['one horn','four legs','a long tail','two ears']}
];
var PARTS=[
 {k:'eye',v:'👁️',pl:'eyes',ipa:'/aɪ/',uk:'око'},
 {k:'ear',v:'👂',pl:'ears',ipa:'/ɪə/',uk:'вухо'},
 {k:'nose',v:'👃',pl:'noses',ipa:'/nəʊz/',uk:'ніс'},
 {k:'leg',v:'🦵',pl:'legs',ipa:'/leɡ/',uk:'нога'},
 {k:'wing',v:'🪽',pl:'wings',ipa:'/wɪŋ/',uk:'крило'},
 {k:'tail',v:TAIL,pl:'tails',ipa:'/teɪl/',uk:'хвіст'},
 {k:'horn',v:HORN,pl:'horns',ipa:'/hɔːn/',uk:'ріг'}
];
var NUMW=['','one','two','three','four','five'];
var COL=[['red','#E02D2D'],['blue','#1E6FE0'],['yellow','#FFD21F'],['green','#22A559'],['orange','#FF8A1F'],['pink','#FF6FB1'],['purple','#8B4FE0'],['brown','#8B5A3C'],['black','#1A1A1A'],['white','#FFFFFF']];
var TEXTS=[
 {t:'Bunny',e:'🐰',s:[['This is Bunny.','Це Бані.'],['Bunny is white.','Бані білий.'],['Bunny has got two long ears.','У Бані є два довгих вуха.'],['Bunny has got a small tail.','У Бані є маленький хвостик.'],['Bunny likes carrots.','Бані любить моркву.']],
  q:[{q:'Bunny is...',o:[['⚪','white'],['🩷','pink'],['⚫','black']],a:0},{q:'How many ears has Bunny got?',o:[['1','one'],['2','two'],['4','four']],a:1},{q:'What does Bunny like?',o:[['🥕','carrots'],['🐟','fish'],['🍖','meat']],a:0}]},
 {t:'Fluffy',e:'🐱',s:[['I have got a cat.','У мене є кіт.'],['Her name is Fluffy.','Її звати Флафі.'],['Fluffy is orange.','Флафі руда.'],['Fluffy has got green eyes.','У Флафі зелені очі.'],['She likes milk.','Вона любить молоко.']],
  q:[{q:'Fluffy is...',o:[['🟠','orange'],['🔵','blue'],['🟣','purple']],a:0},{q:'Fluffy has got ... eyes.',o:[['🟢','green'],['🔴','red'],['🟡','yellow']],a:0},{q:'She likes...',o:[['🥛','milk'],['🥕','carrots'],['🍕','pizza']],a:0}]},
 {t:'The Unicorn',e:'🦄',s:[['Look! This is a unicorn.','Дивись! Це єдиноріг.'],['It is pink and purple.','Він рожевий і фіолетовий.'],['It has got one horn.','У нього є один ріг.'],['It has got four legs.','У нього є чотири ноги.'],['It has got a long tail.','У нього є довгий хвіст.'],['It is my friend.','Він мій друг.']],
  q:[{q:'How many horns has the unicorn got?',o:[['1','one'],['2','two'],['4','four']],a:0},{q:'How many legs has it got?',o:[['2','two'],['4','four'],['6','six']],a:1},{q:'The unicorn is...',o:[['🩷','pink and purple'],['⚫','black'],['🟢','green']],a:0}]}
];
var SENT=[['I have got a cat.','У мене є кіт.'],['I have got a dog.','У мене є собака.'],['She has got a rabbit.','У неї є кролик.'],['He has got a fish.','У нього є рибка.'],['The bird has got wings.','У птаха є крила.'],['The cat has got two ears.','У кота є два вуха.'],['The unicorn has got a horn.','У єдинорога є ріг.'],['The frog has got big eyes.','У жаби великі очі.'],['I have got two ears.','У мене є два вуха.'],['Have you got a cat?','У тебе є кіт?'],['Yes, I have.','Так, є.'],['No, I haven\'t.','Ні, немає.']];
var HG=[['I','have'],['You','have'],['We','have'],['They','have'],['He','has'],['She','has'],['It','has'],['The dog','has'],['My cat','has'],['Anna','has'],['The birds','have'],['My friends','have']];

/* ---------- tabs ---------- */
var TABS=[['words','🐾','Words'],['plural','🔢','1 or 2'],['have','🎀','Have got'],['read','📖','Read'],['trans','🔤','Translate'],['play','🏆','Play']];
var tab='words';
var START={words:function(){ startWords(); },plural:function(){ startPlural(); },have:function(){ startHave(); },read:function(){ startRead(); },trans:function(){ startTrans(); },play:function(){ startPlay(); }};
function drawTabs(){ $('#tabs').innerHTML=TABS.map(function(t){ return '<button class="tab" role="tab" data-t="'+t[0]+'" aria-selected="'+(tab===t[0])+'"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>'; }).join(''); }
function setTab(t){ tab=t; clearTimers(); try{ if(canSpeak) window.speechSynthesis.cancel(); }catch(e){} drawTabs(); START[t](); window.scrollTo(0,0); }
$('#tabs').addEventListener('click',function(e){ var b=e.target.closest('.tab'); if(b) setTab(b.getAttribute('data-t')); });

/* ================= WORDS ================= */
var wm={cat:'animals',mode:'learn',cur:null,pl:{}};
function wItems(){
  var a=ANIM.map(function(x){ return {k:x.k,vis:'<span class="em">'+x.e+'</span>',big:x.e,say:x.k,ipa:x.ipa,uk:x.uk,g:'animals'}; });
  var b=PARTS.map(function(x){ return {k:x.k,vis:'<span class="em">'+x.v+'</span>',big:x.v,say:x.k,ipa:x.ipa,uk:x.uk,g:'body',pl:x.pl}; });
  return wm.cat==='animals'?a:wm.cat==='body'?b:a.concat(b);
}
function wTile(it){ return '<button class="tile" data-k="'+it.k+'" aria-label="'+it.say+'">'+it.vis+'<span>'+it.say+'</span></button>'; }
function startWords(){ wm.cur=null; renderWords(); }
function wBar(){ return chips([['animals','🐱 Animals'],['body','👂 Body'],['all','All']],wm.cat,'data-wc')+chips([['learn','Look & listen'],['play','Play']],wm.mode,'data-wmode'); }
function bindW(){ bindAttr('data-wc',function(v){ wm.cat=v; wm.cur=null; renderWords(); }); bindAttr('data-wmode',function(v){ wm.mode=v; wm.cur=null; renderWords(); }); }
function renderWords(){
  var items=wItems();
  if(wm.mode==='learn'){
    var c=wm.cur, det=c?'<div class="big">'+c.big+'</div><p class="word">'+c.say+(c.pl?' &rarr; <span style="color:var(--pink)">'+c.pl+'</span>':'')+'</p><p class="sub ipa">'+c.ipa+'</p><p class="sub">'+c.uk+'</p>':'<p class="sub" style="padding-top:50px">Tap a picture!</p>';
    $('#view').innerHTML='<div class="card">'+wBar()+'<div class="det" id="det">'+det+'</div><div class="grid">'+items.map(wTile).join('')+'</div></div>'; bindW();
    var ts=document.querySelectorAll('.grid .tile'); for(var i=0;i<ts.length;i++) ts[i].onclick=function(){ var k=this.getAttribute('data-k'); wm.cur=items.filter(function(x){return x.k===k;})[0]; renderWords(); say(wm.cur.say); };
  } else wmPlay(true,items);
}
function wmPlay(first,items){
  var p=wm.pl; if(first||!p.round&&p.round!==0){ p={round:0,total:8,stars:0,t:null,solved:false}; wm.pl=p; }
  if(p.round>=p.total){ $('#view').innerHTML='<div class="card">'+wBar()+'<div class="party">🎉🏆🎉</div><p class="word">'+p.stars+' stars!</p><div class="row"><button class="btn" id="ag">Play again</button></div></div>'; bindW(); $('#ag').onclick=function(){ wmPlay(true,wItems()); }; say('Great job!'); return; }
  var t=items[rnd(0,items.length-1)]; if(p.t) while(t.k===p.t.k&&items.length>3) t=items[rnd(0,items.length-1)];
  var opts=shuffle([t].concat(shuffle(items.filter(function(x){return x.k!==t.k;})).slice(0,2))); p.t=t; p.solved=false;
  $('#view').innerHTML='<div class="card">'+wBar()+'<p class="q">Find: '+t.say+'!</p>'+(canSpeak?'<div class="row" style="margin:0 0 8px"><button class="btn round" id="hear" aria-label="Listen again">🔊</button></div>':'')+'<div class="grid big3">'+opts.map(function(o){ return '<button class="tile" data-k="'+o.k+'" aria-label="'+o.say+'">'+o.vis+'</button>'; }).join('')+'</div><div class="pop" id="msg"></div><p class="sub">'+(p.round+1)+' / '+p.total+'</p></div>';
  bindW(); if(canSpeak) $('#hear').onclick=function(){ say(t.say); }; timers.push(setTimeout(function(){ say(t.say); },250));
  var ts=document.querySelectorAll('.grid.big3 .tile'); for(var i=0;i<ts.length;i++) ts[i].onclick=function(){
    if(p.solved) return;
    if(this.getAttribute('data-k')===t.k){ p.solved=true; this.classList.add('ok'); $('#msg').textContent='⭐ '+t.say+'!'; addStar(); p.stars++; p.round++; say(pick(PRAISE)); timers.push(setTimeout(function(){ wmPlay(false,wItems()); },2000)); }
    else { this.classList.add('no'); $('#msg').textContent='Try again!'; say('Try again'); }
  };
}

/* ================= PLURAL ================= */
var pl={};
function startPlural(){ pl={round:0,total:8,stars:0,solved:false}; newPlural(true); }
function newPlural(first){
  var part=pick(PARTS), n=rnd(1,4), correct=n+' '+(n===1?part.k:part.pl);
  var wrong1=n===1?'2 '+part.pl:n+' '+(n===1?part.pl:part.k);
  var other=(n===1?3:1), wrong2=other+' '+(other===1?part.pl:part.k);
  pl.part=part; pl.n=n; pl.opts=shuffle([correct,wrong1,wrong2]); pl.correct=correct; pl.solved=false; renderPlural();
  timers.push(setTimeout(function(){ say(n===1?'One '+part.k+'.':NUMW[n]+' '+part.pl+'.'); },first?400:200));
}
function renderPlural(){
  if(pl.round>=pl.total){ $('#view').innerHTML='<div class="card"><div class="party">🎉🏆🎉</div><p class="word">'+pl.stars+' stars!</p><p class="sub">Remember: one cat, two cat<b>s</b>!</p><div class="row"><button class="btn" id="ag">Play again</button></div></div>'; $('#ag').onclick=startPlural; say('Great job!'); return; }
  var items=''; for(var i=0;i<pl.n;i++) items+='<span>'+pl.part.v+'</span>';
  $('#view').innerHTML='<div class="card"><div class="sub" style="font-size:22px">1 cat 🐱 &nbsp; 2 cat<b style="color:var(--pink)">s</b> 🐱🐱 &nbsp; (add <b style="color:var(--pink)">-s</b>!)</div><p class="q">How many?</p><div class="items" aria-label="'+pl.n+' items">'+items+'</div>'+
   '<div class="opts">'+pl.opts.map(function(o){ return '<button class="opt" data-o="'+o+'">'+o+'</button>'; }).join('')+'</div><div class="pop" id="msg"></div><p class="sub">'+(pl.round+1)+' / '+pl.total+'</p></div>';
  var os=document.querySelectorAll('.opt'); for(var j=0;j<os.length;j++) os[j].onclick=function(){
    if(pl.solved) return; var o=this.getAttribute('data-o');
    if(o===pl.correct){ pl.solved=true; this.classList.add('ok'); $('#msg').textContent='⭐ '+o+'!'; addStar(); pl.stars++; pl.round++; say(pick(PRAISE)+' '+(pl.n===1?'One '+pl.part.k:NUMW[pl.n]+' '+pl.part.pl)); timers.push(setTimeout(function(){ newPlural(false); },2400)); }
    else { this.classList.add('no'); $('#msg').textContent='Try again!'; say('Try again'); }
  };
}

/* ================= HAVE GOT ================= */
var hv={mode:'rule',k:0,color:null,name:'',fill:{},who:{},my:{},ask:0};
function startHave(){ renderHave(); }
function hBar(){ return chips([['rule','Rule'],['fill','have / has'],['pet','Build a pet'],['who','Who?'],['ask','Have you got?']],hv.mode,'data-hm'); }
function bindH(){ bindAttr('data-hm',function(v){ hv.mode=v; clearTimers(); if(v==='fill') newFill(true); else if(v==='who') newWho(true); else renderHave(); }); }
function renderHave(){
  if(hv.mode==='rule') return renderRule();
  if(hv.mode==='fill') return renderFill();
  if(hv.mode==='pet') return renderPet();
  if(hv.mode==='who') return renderWho();
  renderAsk();
}
function renderRule(){
  var rows=[['I','have','a cat'],['You','have','a dog'],['We','have','a rabbit'],['They','have','a fish'],['He','has','a bird'],['She','has','a frog'],['It','has','a horn']];
  $('#view').innerHTML='<div class="card">'+hBar()+'<p class="q">I <mark>have got</mark> a cat. She <mark>has got</mark> a dog.</p><p class="sub">Have got = у мене є. Tap a line to listen!</p><div class="rulebox">'+rows.map(function(r,i){ return '<button class="rr" data-i="'+i+'"><span class="who">'+r[0]+'</span><span class="hv">'+r[1]+' got</span><span>'+r[2]+'</span></button>'; }).join('')+'</div><p class="sub">I / you / we / they → <b>have</b> got<br>he / she / it → <b>has</b> got</p></div>';
  bindH(); bindAttr('data-i',function(v){ var r=rows[parseInt(v,10)]; say(r[0]+' '+r[1]+' got '+r[2]+'.'); });
}
function newFill(first){ var it=pick(HG); hv.fill={s:it,opts:shuffle(['have','has']),solved:false,round:first?0:hv.fill.round,stars:first?0:hv.fill.stars,total:8}; renderFill(); }
function renderFill(){
  var f=hv.fill; if(!f.s){ return newFill(true); }
  if(f.round>=f.total){ $('#view').innerHTML='<div class="card">'+hBar()+'<div class="party">🎉🏆🎉</div><p class="word">'+f.stars+' stars!</p><div class="row"><button class="btn" id="ag">Play again</button></div></div>'; bindH(); $('#ag').onclick=function(){ newFill(true); }; say('Great job!'); return; }
  $('#view').innerHTML='<div class="card">'+hBar()+'<p class="sub">Choose: have or has?</p><p class="sent">'+f.s[0]+' <span style="border-bottom:5px solid var(--pink);padding:0 20px">'+(f.solved?f.s[1]:'&nbsp;&nbsp;&nbsp;')+'</span> got a pet.</p><div class="opts two">'+f.opts.map(function(o){ return '<button class="opt" data-o="'+o+'">'+o+'</button>'; }).join('')+'</div><div class="pop" id="msg"></div><p class="sub">'+(f.round+1)+' / '+f.total+'</p></div>';
  bindH(); var os=document.querySelectorAll('.opt'); for(var i=0;i<os.length;i++) os[i].onclick=function(){
    if(f.solved) return; var o=this.getAttribute('data-o');
    if(o===f.s[1]){ f.solved=true; this.classList.add('ok'); addStar(); f.stars++; $('#msg').textContent='⭐ '+f.s[0]+' '+o+' got a pet.'; say(f.s[0]+' '+o+' got a pet. '+pick(PRAISE)); timers.push(setTimeout(function(){ f.round++; var it=pick(HG); f.s=it; f.opts=shuffle(['have','has']); f.solved=false; renderFill(); },2600)); }
    else { this.classList.add('no'); $('#msg').textContent='Try again!'; say('Try again'); }
  };
}
function article(w){ return /^[aeiou]/i.test(w)?'an':'a'; }
function petText(){
  var a=ANIM[hv.k], c=hv.color, name=hv.name.trim();
  var lines=['This is my pet.','It is '+(c?article(c[0])+' '+c[0]+' ':'a ')+a.k+'.'].concat(a.f.map(function(f){ return 'It has got '+f+'.'; }));
  if(name) lines.splice(2,0,'Its name is '+name+'.');
  return lines;
}
function renderPet(){
  var lines=petText();
  $('#view').innerHTML='<div class="card">'+hBar()+'<p class="q">Build your magic pet!</p><div class="pets">'+ANIM.map(function(a,i){ return '<button class="tile" data-a="'+i+'" style="min-height:76px;'+(hv.k===i?'background:var(--sun);color:#3A1F5E':'')+'"><span class="em" style="font-size:40px">'+a.e+'</span></button>'; }).join('')+'</div>'+
   '<div class="dots" role="group" aria-label="Color">'+COL.map(function(c,i){ return '<button class="dot" data-c="'+i+'" style="background:'+c[1]+'" aria-pressed="'+(hv.color&&hv.color[0]===c[0])+'" aria-label="'+c[0]+'"></button>'; }).join('')+'</div>'+
   '<input class="inp" id="nm" type="text" placeholder="Name your pet (optional)" value="'+hv.name.replace(/"/g,'&quot;')+'" aria-label="Pet name">'+
   '<div class="story">'+lines.map(function(l){ return '<div>'+l.replace(/has got/,'<mark>has got</mark>')+'</div>'; }).join('')+'</div><div class="row">'+(canSpeak?'<button class="btn" id="hear">🔊 Hear it</button>':'')+'<button class="btn pink" id="ok">✓ I read it!</button></div><p class="sub" style="margin-top:8px">Read your story out loud. Then tell it again without looking!</p></div>';
  bindH(); bindAttr('data-a',function(v){ hv.k=parseInt(v,10); renderPet(); });
  bindAttr('data-c',function(v){ hv.color=COL[parseInt(v,10)]; renderPet(); });
  $('#nm').onchange=function(){ hv.name=this.value; renderPet(); };
  if(canSpeak) $('#hear').onclick=function(){ say(lines.join(' '),0.78); };
  $('#ok').onclick=function(){ addStar(); say(pick(PRAISE)); hv.name=''; hv.color=null; hv.k=(hv.k+1)%ANIM.length; renderPet(); };
}
var WHOQ=[['a horn','unicorn'],['wings','bird'],['long ears','rabbit'],['big eyes','frog']];
function newWho(first){ var q=pick(WHOQ), pool=ANIM.filter(function(a){ return a.k!==q[1]; }), opts=shuffle([ANIM.filter(function(a){return a.k===q[1];})[0]].concat(shuffle(pool).slice(0,2))); hv.who={q:q,opts:opts,solved:false,round:first?0:hv.who.round,stars:first?0:hv.who.stars,total:6}; renderWho(); timers.push(setTimeout(function(){ say('It has got '+q[0]+'.'); },300)); }
function renderWho(){
  var w=hv.who; if(!w.q){ return newWho(true); }
  if(w.round>=w.total){ $('#view').innerHTML='<div class="card">'+hBar()+'<div class="party">🎉🏆🎉</div><p class="word">'+w.stars+' stars!</p><div class="row"><button class="btn" id="ag">Play again</button></div></div>'; bindH(); $('#ag').onclick=function(){ newWho(true); }; say('Great job!'); return; }
  $('#view').innerHTML='<div class="card">'+hBar()+'<p class="sub">Who is it?</p><p class="sent">It <mark>has got</mark> '+w.q[0]+'.</p>'+(canSpeak?'<div class="row" style="margin:0 0 8px"><button class="btn round" id="hear" aria-label="Listen again">🔊</button></div>':'')+'<div class="grid big3">'+w.opts.map(function(a){ return '<button class="tile" data-k="'+a.k+'" aria-label="'+a.k+'"><span class="em">'+a.e+'</span></button>'; }).join('')+'</div><div class="pop" id="msg"></div><p class="sub">'+(w.round+1)+' / '+w.total+'</p></div>';
  bindH(); if(canSpeak) $('#hear').onclick=function(){ say('It has got '+w.q[0]+'.'); };
  var ts=document.querySelectorAll('.grid .tile'); for(var i=0;i<ts.length;i++) ts[i].onclick=function(){
    if(w.solved) return; var k=this.getAttribute('data-k');
    if(k===w.q[1]){ w.solved=true; this.classList.add('ok'); addStar(); w.stars++; $('#msg').textContent='⭐ The '+k+' has got '+w.q[0]+'!'; say('The '+k+' has got '+w.q[0]+'. '+pick(PRAISE)); timers.push(setTimeout(function(){ var r=w.round+1, st=w.stars; newWho(false); hv.who.round=r; hv.who.stars=st; renderWho(); },2800)); }
    else { this.classList.add('no'); $('#msg').textContent='Try again!'; say('Try again'); }
  };
}
function renderAsk(){
  var a=ANIM[hv.ask%ANIM.length], has=!!hv.my[a.k];
  $('#view').innerHTML='<div class="card">'+hBar()+'<p class="sub">Which pets have you got? Tap them! (pretend is OK)</p><div class="pets">'+ANIM.map(function(x){ return '<button class="tile" data-m="'+x.k+'" style="min-height:76px;'+(hv.my[x.k]?'background:var(--good)':'')+'"><span class="em" style="font-size:40px">'+x.e+'</span></button>'; }).join('')+'</div>'+
   '<div class="story" style="text-align:center"><div class="big" style="font-size:80px">'+a.e+'</div><div class="q">Have you got a '+a.k+'?</div><div class="sub">'+(has?'Yes, I <mark>have</mark>.':'No, I <mark>haven\'t</mark>.')+'</div></div>'+
   '<div class="row">'+(canSpeak?'<button class="btn" id="hear">🔊 Question</button>':'')+'<button class="btn pink" id="ok">✓ I said it!</button><button class="btn alt" id="nx">Next →</button></div></div>';
  bindH(); bindAttr('data-m',function(v){ hv.my[v]=!hv.my[v]; renderAsk(); });
  if(canSpeak) $('#hear').onclick=function(){ say('Have you got a '+a.k+'?'); };
  $('#ok').onclick=function(){ addStar(); say(has?'Yes, I have.':'No, I haven\'t.'); hv.ask++; timers.push(setTimeout(renderAsk,900)); };
  $('#nx').onclick=function(){ hv.ask++; renderAsk(); };
}

/* ================= READ ================= */
var rd={i:0,show:{},qi:0,picked:-1,mode:'text'};
function startRead(){ rd={i:rd.i||0,show:{},qi:0,picked:-1,mode:'text'}; renderRead(); }
function renderRead(){
  var t=TEXTS[rd.i];
  var bar=chips(TEXTS.map(function(x,i){ return [i,x.e+' '+x.t]; }),rd.i,'data-ti')+chips([['text','📖 Read'],['quiz','❓ Questions']],rd.mode,'data-rm');
  var h='<div class="card">'+bar;
  if(rd.mode==='text'){
    h+='<div class="big" style="font-size:80px">'+t.e+'</div><p class="sub">Tap 🔊 to listen. Tap a sentence to see the Ukrainian.</p><div class="text">'+t.s.map(function(s,i){ return '<div class="ts"><div class="row" style="margin:0;justify-content:space-between"><div class="en">'+s[0].replace(/has got|have got/,'<mark>$&</mark>')+'</div>'+(canSpeak?'<button class="btn round" data-hs="'+i+'" aria-label="Listen" style="width:52px;height:52px;font-size:24px">🔊</button>':'')+'</div><button class="btn alt" data-sh="'+i+'" style="min-height:40px;font-size:18px;margin-top:6px">'+(rd.show[i]?'Hide':'🇺🇦 Show')+'</button>'+(rd.show[i]?'<div class="uk">'+s[1]+'</div>':'')+'</div>'; }).join('')+'</div><div class="row">'+(canSpeak?'<button class="btn" id="all">🔊 Read all</button>':'')+'<button class="btn pink" id="gq">Questions →</button></div>';
  } else {
    var q=t.q[rd.qi%t.q.length];
    h+='<p class="q">'+q.q+'</p><div class="opts">'+q.o.map(function(o,i){ return '<button class="opt" data-o="'+i+'" style="font-size:'+(o[0].length>2?'24':'40')+'px">'+o[0]+'<br><span style="font-size:18px">'+o[1]+'</span></button>'; }).join('')+'</div><div class="pop" id="msg"></div><p class="sub">'+((rd.qi%t.q.length)+1)+' / '+t.q.length+'</p>';
  }
  $('#view').innerHTML=h+'</div>';
  bindAttr('data-ti',function(v){ rd={i:parseInt(v,10),show:{},qi:0,picked:-1,mode:'text'}; renderRead(); }); bindAttr('data-rm',function(v){ rd.mode=v; rd.qi=0; renderRead(); });
  bindAttr('data-hs',function(v){ say(t.s[parseInt(v,10)][0]); }); bindAttr('data-sh',function(v){ rd.show[v]=!rd.show[v]; renderRead(); });
  if($('#all')) $('#all').onclick=function(){ say(t.s.map(function(s){return s[0];}).join(' '),0.78); };
  if($('#gq')) $('#gq').onclick=function(){ rd.mode='quiz'; rd.qi=0; renderRead(); };
  if(rd.mode==='quiz'){ var q2=t.q[rd.qi%t.q.length]; timers.push(setTimeout(function(){ say(q2.q.replace('...','')); },300));
    var os=document.querySelectorAll('.opt'); for(var j=0;j<os.length;j++) os[j].onclick=function(){
      var k=parseInt(this.getAttribute('data-o'),10); if(rd.picked===q2.a) return;
      if(k===q2.a){ rd.picked=k; this.classList.add('ok'); $('#msg').textContent='⭐ '+q2.o[k][1]+'!'; addStar(); say(pick(PRAISE)+' '+q2.o[k][1]); timers.push(setTimeout(function(){ rd.picked=-1; rd.qi++; if(rd.qi>=t.q.length){ rd.mode='text'; rd.qi=0; } renderRead(); },2200)); }
      else { this.classList.add('no'); $('#msg').textContent='Try again!'; say('Try again'); }
    }; }
}

/* ================= TRANSLATE ================= */
var tr={mode:'en',i:0,order:[],show:false,bank:[],tray:[],state:'',tries:0,score:0};
function startTrans(){ tr.order=shuffle(SENT); tr.i=0; tr.show=false; tr.score=0; loadTr(); }
function trBar(){ return chips([['en','English → Ukrainian'],['uk','Ukrainian → English']],tr.mode,'data-tm'); }
function loadTr(){
  var s=tr.order[tr.i%tr.order.length]; tr.show=false; tr.state=''; tr.tries=0;
  if(tr.mode==='uk'){ var toks=s[0].split(' ').map(function(t,k){ return {id:k,t:t}; }), sh=shuffle(toks), g=0; while(sh.map(function(x){return x.t;}).join(' ')===s[0]&&g++<20) sh=shuffle(toks); tr.bank=sh; tr.tray=[]; }
  renderTr();
}
function renderTr(){
  var s=tr.order[tr.i%tr.order.length], h='<div class="card">'+trBar();
  if(tr.mode==='en'){
    h+='<p class="sub">Read the sentence. Say it in Ukrainian!</p><div class="story" style="text-align:center">'+s[0].replace(/has got|have got|haven't|have/,'<mark>$&</mark>')+'</div>'+(tr.show?'<div class="ts"><div class="uk" style="font-size:26px;color:var(--ink);font-weight:700">'+s[1]+'</div></div>':'')+'<div class="row">'+(canSpeak?'<button class="btn round" id="hear" aria-label="Listen">🔊</button>':'')+'<button class="btn alt" id="sh">'+(tr.show?'Hide':'🇺🇦 Show')+'</button><button class="btn pink" id="ok">✓ I said it!</button></div>';
  } else {
    h+='<p class="sub">Put the English words in order!</p><div class="story" style="text-align:center">'+s[1]+'</div><div class="tray '+tr.state+'">'+(tr.tray.length?tr.tray.map(function(x){ return '<button class="tok" data-f="t" data-id="'+x.id+'">'+x.t+'</button>'; }).join(''):'<span class="sub">Tap the words</span>')+'</div><div class="bank">'+tr.bank.map(function(x){ return '<button class="tok" data-f="b" data-id="'+x.id+'">'+x.t+'</button>'; }).join('')+'</div>';
    if(tr.state==='ok') h+='<div class="row">'+(canSpeak?'<button class="btn round" id="bl" aria-label="Listen">🔊</button>':'')+'<button class="btn pink" id="bn">Next →</button></div>';
    else h+='<div class="row"><button class="btn pink" id="bc"'+(tr.bank.length?' disabled':'')+'>Check</button><button class="btn alt" id="bx">Clear</button>'+(tr.tries>=2?'<button class="btn" id="bs">Show</button>':'')+'</div>'+(tr.state==='no'?'<div class="pop">Try again!</div>':'');
  }
  $('#view').innerHTML=h+'</div>';
  bindAttr('data-tm',function(v){ tr.mode=v; startTrans(); });
  if(tr.mode==='en'){
    if(canSpeak) $('#hear').onclick=function(){ say(s[0]); }; $('#sh').onclick=function(){ tr.show=!tr.show; renderTr(); };
    $('#ok').onclick=function(){ addStar(); say(pick(PRAISE)); tr.i++; loadTr(); };
  } else {
    var ts=document.querySelectorAll('.tok'); for(var i=0;i<ts.length;i++) ts[i].onclick=function(){ if(tr.state==='ok') return; var id=parseInt(this.getAttribute('data-id'),10), fb=this.getAttribute('data-f')==='b', src=fb?tr.bank:tr.tray, dst=fb?tr.tray:tr.bank, k=src.findIndex(function(x){return x.id===id;}); dst.push(src.splice(k,1)[0]); tr.state=''; renderTr(); };
    if($('#bc')) $('#bc').onclick=function(){ var a=tr.tray.map(function(x){return x.t;}).join(' '); if(a===s[0]){ tr.state='ok'; if(tr.tries===0) addStar(); say(s[0]); } else { tr.state='no'; tr.tries++; say('Try again'); } renderTr(); };
    if($('#bx')) $('#bx').onclick=function(){ tr.bank=tr.bank.concat(tr.tray); tr.tray=[]; tr.state=''; renderTr(); };
    if($('#bs')) $('#bs').onclick=function(){ tr.tray=s[0].split(' ').map(function(t,k){ return {id:k,t:t}; }); tr.bank=[]; tr.state='ok'; renderTr(); };
    if($('#bn')) $('#bn').onclick=function(){ tr.i++; loadTr(); };
    if($('#bl')) $('#bl').onclick=function(){ say(s[0]); };
  }
}

/* ================= PLAY (mixed) ================= */
var py={};
function startPlay(){ py={round:0,total:10,stars:0,q:null,solved:false}; nextPlay(true); }
function nextPlay(first){
  var type=pick(['pic','plural','hg']), q={type:type};
  if(type==='pic'){ var a=pick(ANIM), opts=shuffle([a].concat(shuffle(ANIM.filter(function(x){return x.k!==a.k;})).slice(0,2))); q.say='Find the '+a.k+'!'; q.title='Find: '+a.k+'!'; q.opts=opts.map(function(o){ return {k:o.k,h:'<span style="font-size:60px">'+o.e+'</span>'}; }); q.a=a.k; q.speak='Find the '+a.k; q.win=a.k; }
  else if(type==='plural'){ var part=pick(PARTS.slice(0,5)), n=rnd(2,4), ok=n+' '+part.pl; var items=''; for(var i=0;i<n;i++) items+=part.v; q.title='How many?'; q.pre='<div class="items">'+items.split('').length?'':''; q.vis=''; for(var j=0;j<n;j++) q.vis+='<span>'+part.v+'</span>'; q.opts=shuffle([ok,n+' '+part.k,(n===2?3:2)+' '+part.pl]).map(function(o){ return {k:o,h:o}; }); q.a=ok; q.speak=NUMW[n]+' '+part.pl; q.win=ok; }
  else { var it=pick(HG); q.title=it[0]+' ___ got a pet.'; q.opts=shuffle(['have','has']).map(function(o){ return {k:o,h:o}; }); q.a=it[1]; q.speak=it[0]+' '+it[1]+' got a pet'; q.win=it[0]+' '+it[1]+' got a pet'; }
  py.q=q; py.solved=false; renderPlay(); timers.push(setTimeout(function(){ say(type==='pic'?q.speak:(type==='plural'?'How many?':'Have or has?')); },first?300:150));
}
function renderPlay(){
  if(py.round>=py.total){ $('#view').innerHTML='<div class="card"><div class="party">🎉🏆🎉</div><p class="word">'+py.stars+' stars!</p><p class="sub">You are a Magic Pets star!</p><div class="row"><button class="btn" id="ag">Play again</button></div></div>'; $('#ag').onclick=startPlay; say('Great job! You are a star!'); return; }
  var q=py.q, three=q.opts.length===3;
  $('#view').innerHTML='<div class="card"><p class="sub">Star game '+(py.round+1)+' / '+py.total+'</p><p class="q">'+q.title+'</p>'+(q.vis?'<div class="items">'+q.vis+'</div>':'')+'<div class="opts'+(three?'':' two')+'">'+q.opts.map(function(o){ return '<button class="opt" data-o="'+o.k+'">'+o.h+'</button>'; }).join('')+'</div><div class="pop" id="msg"></div></div>';
  var os=document.querySelectorAll('.opt'); for(var i=0;i<os.length;i++) os[i].onclick=function(){
    if(py.solved) return; var o=this.getAttribute('data-o');
    if(o===q.a){ py.solved=true; this.classList.add('ok'); addStar(); py.stars++; py.round++; $('#msg').textContent='⭐ '+q.win; say(q.win+'. '+pick(PRAISE)); timers.push(setTimeout(function(){ nextPlay(false); },2300)); }
    else { this.classList.add('no'); $('#msg').textContent='Try again!'; say('Try again'); }
  };
}
